name: Build Check
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - run: npm ci
    - run: |
        echo ">>> Start compile vssm-md."
        npm run build
        echo ">>> Compile vssm-md success!"